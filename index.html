<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup Form</title>
    <style>
        @font-face {
            font-family: 'Norse';
            src: url('Norse.otf') format('opentype');
        }

        body {
            background-image: url("halie-west-leaves.jpg");
            background-size: 50% auto;
            background-repeat: no-repeat;
        }
        /*
        .container {
            display: flex;
            flex-direction: space-between;
        }
            */
        .logo {
            background-color: rgb(0 0 0 / 50%);
            color: white;
            width: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Norse";
            font-size: 4rem;
            font-weight: 800;
        }
        .logo img {
            width: 80px;
        }
        .textarea {
            width: 45%;
            margin: 20px;
            font-weight: 500;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            position: absolute;
            right: 0;
            top: 0;
        }
        .form-area {
            width: 45%;
            margin: 20px;
            padding: 20px;
            font-weight: 500;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            position: absolute;
            right: 0;
            top: 1;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.3);
        }
        button,
        label,
        input {
            font-family: inherit;
            font-size: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="odin-lined.png">
            ODIN
        </div>
    <div class="textarea">
        <p class="intro-text">
            This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams. Sign up <em>now</em> to get started.
        </p>
        <p class="intro-text">
            You <em>know</em> you want to.
        </p>
    </div>
    <div class="form-area">
        <p class="intro-text">
            Let's do this!
        </p>
        <form action="https://google.com" method="post">
            <label for="first_name">First Name: </label>
            <input type="text" id="first_name">
            <label for="last_name">Last Name: </label>
            <input type="text" id="last_name">
            <br>
            <label for="email">Email: </label>
            <input type="email" id="email">
            <label for="phone">Phone Number: </label>
            <input type="tel" id="phone">
            <br>
            <label for="password">Password: </label>
            <input type="password" id="password">
            <label for="confirm-password">Confirm Password: </label>
            <input type="password" id="confirm-password">
        </form>
    </div>
    </div>
</body>
</html>
