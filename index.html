<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup Form</title>
    <style>
        @font-face {
            font-family: 'Norse';
            src: url('Norse.otf') format('opentype');
        }
        body {
            background-color: #000000;
            font-weight: 500;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }
        .container {
                    display: flex;
                    flex-direction: row;
                    justify-content: space-between;
                }
        .logo-container {
            width: 60%;
            min-height: 100vh;
            background-image: url("halie-west-leaves.jpg");
            background-repeat: no-repeat;
            background-size: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-left: 150px;
        }
        /*
        
            */
        .logo {
            background-color: rgb(0 0 0 / 50%);
            color: white;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Norse";
            font-size: 4rem;
            font-weight: 900;
        }
        .logo img {
            width: 80px;
        }
        .text-container {
            background-color: #FFFFFF;
            margin-right: 150px;
            padding-top: 50px;
        }
        .textarea {
            margin: 20px;
            
            
        }
        .form-area {
            margin: 2px;
            padding: 20px;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.3);
        }
        form {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .form-field {
            display: flex;
            flex-direction: column;
            flex: 1 1 40%;
        }
        label
        {
            font-family: inherit;
            font-size: 100%;
            display: block;
        }
        input {
            border: 1px solid #E5E7EB;
            font-family: inherit;
            font-size: 100%;
            display: block;
        }
        .login-area {
            padding: 20px;
        }
        button {
            background-color: #596D48;
            padding: 8px 20px;
            color: white;
            font-weight: 900;
            border-radius: 10px;
        }
        a {
            text-decoration: none;
            font-weight: 600;
            color: #596D48;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-container">
        <div class="logo">
            <img src="odin-lined.png">
            ODIN
        </div>
        </div>
        <div class="text-container">
    <div class="textarea">
        <p class="intro-text">
            This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams. Sign up <em>now</em> to get started.
        </p>
        <p class="intro-text">
            You <em>know</em> you want to.
        </p>
    </div>
    <div class="form-area">
        <div class="form-text">
            <p class="intro-text">
                Let's do this!
            </p>
        </div>
        <form action="https://google.com" method="post">
            <div class="form-field">
                <label for="first_name">First Name: </label>
                <input type="text" id="first_name">
            </div>
            <div class="form-field">
                <label for="last_name">Last Name: </label>
                <input type="text" id="last_name">
            </div>
            <div class="form-field">
                <label for="email">Email: </label>
                <input type="email" id="email">
            </div>
            <div class="form-field">
                <label for="phone">Phone Number: </label>
                <input type="tel" id="phone">
            </div>
            <div class="form-field">
                <label for="password">Password: </label>
                <input type="password" id="password">
            </div>
            <div class="form-field">
                <label for="confirm-password">Confirm Password: </label>
                <input type="password" id="confirm-password">
            </div>
        </form>
    </div>
    <div class="login-area">
        <button>Create Account</button>
        <div class="login-text">
            <p>Already have an account? <a href="">Log in</a></p>
        </div>
    </div>
    </div>
    </div>
</body>
</html>
