<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="left-container">
        <div class="logo-container">
        <div class="logo">
            <img src="odin-lined.png">
            ODIN
        </div>
        
        <div class="white">
            <p>Photo by <a href="https://unsplash.com/photos/green-leaf-plant-in-close-up-photography-25xggax4bSA">Halie West</a> on <a href="https://unsplash.com/">Unsplash</a></p>
        </div>
        </div>
        </div>
        <div class="text-container">
    <div class="textarea">
        <p class="intro-text">
            This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams. Sign up <em>now</em> to get started.
        </p>
        <p class="intro-text">
            You <em>know</em> you want to.
        </p>
    </div>
    <div class="form-area">
        <div class="form-text">
            <p class="intro-text">
                Let's do this!
            </p>
        </div>
        <form action="https://google.com" method="post">
            <div class="form-field">
                <label for="first_name">First Name: </label>
                <input type="text" id="first_name">
            </div>
            <div class="form-field">
                <label for="last_name">Last Name: </label>
                <input type="text" id="last_name">
            </div>
            <div class="form-field">
                <label for="email">Email: </label>
                <input type="email" id="email">
            </div>
            <div class="form-field">
                <label for="phone">Phone Number: </label>
                <input type="tel" id="phone">
            </div>
            <div class="form-field">
                <label for="password">Password: </label>
                <input type="password" id="password">
            </div>
            <div class="form-field">
                <label for="confirm-password">Confirm Password: </label>
                <input type="password" id="confirm-password">
            </div>
        </form>
    </div>
    <div class="login-area">
        <button>Create Account</button>
        <div class="login-text">
            <p>Already have an account? <a href="">Log in</a></p>
        </div>
    </div>
    </div>
    </div>
</body>
</html>
